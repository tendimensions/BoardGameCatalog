# =============================================================================
# Board Game Catalog — CodeMagic CI/CD
# =============================================================================
#
# Builds Android (APK) and iOS (IPA) and distributes via Firebase App Distribution.
# Release notes are generated into release_notes.txt from the top section of
# mobile/CHANGELOG.md before each build.
#
# REQUIRED SECRETS — set these in CodeMagic → Teams → Global variables / secrets:
#
#   Group: firebase_credentials
#     FIREBASE_SERVICE_ACCOUNT   — GCP service account JSON (raw JSON, not base64)
#     FIREBASE_ANDROID_APP_ID    — Android app ID from Firebase console
#     FIREBASE_IOS_APP_ID        — iOS app ID from Firebase console
#
# iOS signing is via Codemagic's Code signing identities (Settings → codemagic.yaml
# settings → Code signing identities), referenced below by name — not env vars:
#   certificate: ios_distribution_cert (shared across all personal-account apps)
#   provisioning profile: boardgamecatalog_adhoc (this app only)
#
# =============================================================================

workflows:

  # ── Android ─────────────────────────────────────────────────────────────────
  android-release:
    name: Android — Firebase Distribution
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - firebase_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
        working_directory: mobile

      - name: Generate Firebase release notes
        script: python3 scripts/generate_release_notes.py

      - name: Build APK
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER
        working_directory: mobile

    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - testers

  # ── iOS ──────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS — Firebase Distribution
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      ios_signing:
        certificates:
          - ios_distribution_cert
        provisioning_profiles:
          - boardgamecatalog_adhoc
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
        working_directory: mobile

      - name: Get packages
        script: flutter pub get
        working_directory: mobile

      - name: Generate Firebase release notes
        script: python3 scripts/generate_release_notes.py

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
        working_directory: mobile

    artifacts:
      - mobile/build/ios/ipa/*.ipa

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        ios:
          app_id: $FIREBASE_IOS_APP_ID
          groups:
            - testers

  # ── iOS + Android ─────────────────────────────────────────────────────────────
  all-release:
    name: iOS + Android — Firebase Distribution
    instance_type: mac_mini_m1
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      ios_signing:
        certificates:
          - ios_distribution_cert
        provisioning_profiles:
          - boardgamecatalog_adhoc
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
        working_directory: mobile

      - name: Get packages
        script: flutter pub get
        working_directory: mobile

      - name: Generate Firebase release notes
        script: python3 scripts/generate_release_notes.py

      - name: Build APK
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER
        working_directory: mobile

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
        working_directory: mobile

    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-release.apk
      - mobile/build/ios/ipa/*.ipa

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - testers
        ios:
          app_id: $FIREBASE_IOS_APP_ID
          groups:
            - testers
